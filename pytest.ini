# pytest.ini
[pytest]
pythonpath = . src
addopts = -ra -q --strict-markers --strict-config -p no:seleniumbase

markers =
    smoke: quick sanity path per application (SauceDemo, BlazeDemo, OrangeHRM)
    e2e: end-to-end Playwright web UI tests
    regression: full functional regression suite
    slow: long-running tests
